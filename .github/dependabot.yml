# Weekly dependency updates (P7). Minor and patch bumps come as one PR per ecosystem; a major bump gets its own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    # / covers .config/dotnet-tools.json, so the vpk tool moves in the same PR as the Velopack package (they must match).
    directories:
      - /
      - /host/*
      - /server/*
    schedule:
      interval: weekly
    groups:
      velopack:
        patterns: [Velopack, vpk]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
