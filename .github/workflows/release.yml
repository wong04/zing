# Builds the Velopack installer (scripts/pack.ps1) and, on a v* tag, uploads it to a draft GitHub release.
#
# Secrets (Settings → Secrets and variables → Actions), passed only on tag pushes and manual runs, never on pull requests:
#   ZING_GOOGLE_CLIENT_ID     → env ZingGoogleClientId      (MSBuild reads it as a property; without it the build has no sync)
#   ZING_GOOGLE_CLIENT_SECRET → env ZingGoogleClientSecret
#   AZURE_SIGNING_ACCOUNT     → env AZURE_SIGNING_ACCOUNT   (unset for now, so the sign step never runs)
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/pack.ps1
      - .github/workflows/release.yml
      - .config/dotnet-tools.json
      - winget/**
      - host/Zing.Host/Zing.Host.csproj
      - host/Zing.Core/RendererLocation.cs
      - scripts/gen-notices.ts
      - scripts/notices.ts
      - package.json

permissions:
  contents: read

jobs:
  # The same checks as ci.yml's check job, so a tag never ships a red build.
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('host/**/*.csproj', 'global.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:host

  pack:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # Step `if:` can't read secrets, so the sign step tests this instead.
      AZURE_SIGNING_ACCOUNT: ${{ github.event_name != 'pull_request' && secrets.AZURE_SIGNING_ACCOUNT || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('host/**/*.csproj', 'global.json') }}
      - run: npm ci
      - run: dotnet tool restore
      - name: Version
        id: version
        shell: pwsh
        run: |
          switch ($env:GITHUB_EVENT_NAME) {
            'push' {
              if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
                throw "tag $env:GITHUB_REF_NAME is not v<semver>"
              }
              $version = $Matches[1]
            }
            'workflow_dispatch' { $version = "0.9.0-dispatch.$env:GITHUB_RUN_NUMBER" }
            default { $version = "0.9.0-pr.$env:GITHUB_RUN_NUMBER" }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "version $version"
      # The latest published release, so vpk pack can build a delta package from it.
      - name: Download the previous release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet vpk download github --repoUrl https://github.com/wong04/zing --token $env:GH_TOKEN --outputDir artifacts/releases
      - name: Sign
        if: env.AZURE_SIGNING_ACCOUNT != ''
        # Code signing plugs in here: Azure Trusted Signing (`vpk pack --azureTrustedSignFile metadata.json`) or SignPath
        # (`vpk pack --signTemplate "<command> {{file}}"`), passed through scripts/pack.ps1. Not set up yet.
        run: echo "signing is not configured"
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ZingGoogleClientId: ${{ github.event_name != 'pull_request' && secrets.ZING_GOOGLE_CLIENT_ID || '' }}
          ZingGoogleClientSecret: ${{ github.event_name != 'pull_request' && secrets.ZING_GOOGLE_CLIENT_SECRET || '' }}
        run: npm run pack -- -Version $env:VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: zing-${{ steps.version.outputs.version }}
          path: artifacts/releases/
          retention-days: 14

  # Tag pushes only: uploads the packed release as a draft, which the owner publishes by hand.
  release:
    if: github.event_name == 'push'
    needs: [checks, pack]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - run: dotnet tool restore
      - uses: actions/download-artifact@v4
        with:
          name: zing-${{ needs.pack.outputs.version }}
          path: artifacts/releases
      # vpk leaves the release a draft unless --publish is given.
      # A prerelease tag (v1.1.0-beta.1) is uploaded without --pre too: the owner marks it when publishing the draft.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet vpk upload github --repoUrl https://github.com/wong04/zing --token $env:GH_TOKEN --outputDir artifacts/releases --releaseName "Zing $env:VERSION" --tag $env:GITHUB_REF_NAME

  # Enabled at 1.0: after a release is published, opens a winget-pkgs PR bumping wong04.Zing (winget/manifests).
  winget:
    if: false
    needs: [pack, release]
    runs-on: windows-latest
    steps:
      - env:
          VERSION: ${{ needs.pack.outputs.version }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile wingetcreate.exe
          .\wingetcreate.exe update wong04.Zing --version $env:VERSION --urls "https://github.com/wong04/zing/releases/download/$env:GITHUB_REF_NAME/ZingBrowser-win-Setup.exe" --submit --token $env:WINGET_TOKEN
