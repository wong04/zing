name: ci

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

# A newer push to the same branch makes an older run moot; main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The fast checks, in parallel with e2e so they report in about two minutes.
  check:
    runs-on: windows-latest
    # A run takes about 5 minutes; a hung test host would otherwise hold the runner for GitHub's 6 h default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('host/**/*.csproj', 'global.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:host

  # The sync server: its tests, then the Docker image booted with throwaway values and probed on /health.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/**/*.csproj', 'global.json') }}
      - run: dotnet test server/Zing.Server.Tests
      - run: docker build -t zing-server server
      - name: Boot the image and wait for /health
        run: |
          docker run -d --name zing-server -p 8080:8080 \
            -e PORT=8080 \
            -e ASPNETCORE_ENVIRONMENT=Staging \
            -e ZING_SERVER_FAKE_GOOGLE=1 \
            -e ZING_SESSION_KEY="$(openssl rand -base64 32)" \
            -e ZING_ALLOWED_SUBS=ci-throwaway-sub \
            -e ZING_DB_PATH=/tmp/zing.db \
            zing-server
          for attempt in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health)" = "200" ]; then
              echo "healthy after $attempt attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "no 200 from /health within 60s"
          docker logs zing-server
          exit 1

  # The e2e suite split across runners (Playwright sharding): each builds Zing and runs its third.
  e2e:
    runs-on: windows-latest
    # A shard takes 10 to 25 minutes; a hung Zing.exe would otherwise hold the runner for GitHub's 6 h default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('host/**/*.csproj', 'global.json') }}
      - run: npm ci
      - run: npm run build
      - run: npm run build:host
      - run: npx playwright test --shard=${{ matrix.shard }}/3
        env:
          # The runner's clipboard is nobody's, so the clipboard tests run here (e2e/tools-text.spec.ts).
          ZING_E2E_CLIPBOARD: '1'
      # A failed test's pictures of every Zing view, its recorded errors and fault log (e2e/zing.ts `test`).
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
