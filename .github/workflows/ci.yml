name: ci

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:host
      - run: npm run test:e2e
      # TEMPORARY (reverted once found): repeat the crash spec to catch its intermittent failure with diagnostics.
      - if: always()
        run: npx playwright test e2e/crash.spec.ts --repeat-each=8
