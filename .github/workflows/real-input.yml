# TEMPORARY: the real-input tier on a Windows runner nobody is using, for the caption-button and
# Ctrl+S fixes. Remove once it passes.
name: real-input

on:
  push:
    branches: ['claude/**']

jobs:
  real-input:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: npm ci
      - run: npm run test:e2e:real-input
