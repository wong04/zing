			<stop offset="0" stop-color="#FF4F7B"/>
			<stop offset="1" stop-color="#FF9A3D"/>
		</linearGradient>
		<linearGradient id="c-cool" x1="464" y1="464" x2="864" y2="864" gradientUnits="userSpaceOnUse">
